// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
alias(libs.plugins.android.application) apply false
}

// Force a single Kotlin stdlib version across all subprojects to avoid duplicate-class errors
subprojects {
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                // normalize all kotlin stdlib variants to a single version
                if (details.requested.name.startsWith('kotlin-stdlib')) {
                    details.useVersion('1.8.22')
                }
                if (details.requested.name == 'kotlin-stdlib-common') {
                    details.useVersion('1.8.22')
                }
            }
        }
        // force commonly used stdlib coordinates as an extra safety net
        resolutionStrategy.force(
            'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22',
            'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
        )
    }
}
